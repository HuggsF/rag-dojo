apiVersion: v1
kind: Pod
metadata:
  name: neo4j
  namespace: default
  labels:
    app: rag-dojo
    component: neo4j
spec:
  containers:
    - name: neo4j
      image: neo4j
      env:
        - name: NEO4J_AUTH
          value: "neo4j/ragdojo2026"
        - name: NEO4J_PLUGINS
          value: '["apoc"]'
        - name: NEO4J_server_config_strict__validation_enabled
          value: "false"
      ports:
        - containerPort: 7687
          name: bolt
        - containerPort: 7474
          name: http
      livenessProbe:
        tcpSocket:
          port: 7687
        initialDelaySeconds: 30
        periodSeconds: 60
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        tcpSocket:
          port: 7687
        initialDelaySeconds: 10
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
      resources:
        requests:
          memory: "512Mi"
          cpu: "250m"
        limits:
          memory: "1Gi"
          cpu: "500m"
  restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: default
  labels:
    app: rag-dojo
spec:
  selector:
    component: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687
    - name: http
      port: 7474
      targetPort: 7474
